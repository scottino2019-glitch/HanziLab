<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with warm rounded squircle -->
  <rect width="512" height="512" rx="110" fill="#f3ece2" />
  <!-- Seal container -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="url(#sealBg)" stroke="#d97706" stroke-width="8" filter="url(#shadow)" />
  <!-- Inner delicate border -->
  <rect x="76" y="76" width="360" height="360" rx="64" fill="none" stroke="#fef3c7" stroke-width="3" stroke-dasharray="16,8" opacity="0.8" />
  <!-- Chinese Calligraphy Character '字' (Character / Script) -->
  <text x="256" y="325" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="240" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">字</text>
  <!-- Subtitle pin text -->
  <text x="256" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="700" fill="#fef3c7" text-anchor="middle" letter-spacing="6" opacity="0.9">HANZI</text>
</svg>
